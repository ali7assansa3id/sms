<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إرسال SMS إلى مصر</title>

  <style>
    body{
      font-family:system-ui,sans-serif;
      max-width:680px;
      margin:auto;
      padding:20px;
      background:#f5f6f8;
    }

    main{
      background:white;
      padding:20px;
      border-radius:16px;
    }

    label{
      display:block;
      margin:14px 0 6px;
      font-weight:700;
    }

    input,textarea,select{
      width:100%;
      box-sizing:border-box;
      padding:12px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:16px;
    }

    textarea{
      min-height:130px;
    }

    button{
      width:100%;
      padding:13px;
      margin-top:16px;
      border:0;
      border-radius:10px;
      background:#111;
      color:white;
      font-size:17px;
      cursor:pointer;
    }

    button:disabled{
      opacity:.6;
    }

    pre{
      white-space:pre-wrap;
      background:#f1f1f1;
      padding:12px;
      border-radius:10px;
      margin-top:16px;
    }
  </style>
</head>

<body>

<main>

  <h1>إرسال SMS إلى مصر</h1>

  <label for="to">رقم المستلم</label>
  <input
    id="to"
    type="tel"
    inputmode="tel"
    placeholder="010XXXXXXXX"
  >

  <label for="from">Sender ID</label>
  <input
    id="from"
    type="text"
    value="ALI"
    maxlength="11"
  >

  <label for="category">نوع الرسالة</label>

  <select id="category">
    <option value="transactional">Transactional</option>
    <option value="authentication">Authentication</option>
    <option value="service">Service</option>
    <option value="marketing">Marketing</option>
  </select>

  <label for="text">الرسالة</label>

  <textarea
    id="text"
    maxlength="1600"
    placeholder="اكتب الرسالة هنا..."
  ></textarea>

  <button id="send" type="button">
    إرسال
  </button>

  <pre id="out">جاهز.</pre>

</main>

<script>
"use strict";

/*
 * عنوان الـ Backend على Vercel
 */
const BACKEND = "/api/send";
/*
 * اختصار للوصول إلى عناصر الصفحة
 */
const $ = (id) => document.getElementById(id);


/*
 * تحويل الرقم المصري إلى الصيغة الدولية
 */
function normalizeEgyptianNumber(value) {

  let number = value.trim();

  // إزالة المسافات والشرطات والأقواس
  number = number.replace(/[\s\-()]/g, "");

  // 01012345678
  if (/^01\d{9}$/.test(number)) {
    return "+20" + number.substring(1);
  }

  // 201012345678
  if (/^20\d{10}$/.test(number)) {
    return "+" + number;
  }

  // +201012345678
  if (/^\+20\d{10}$/.test(number)) {
    return number;
  }

  return null;
}


/*
 * زر الإرسال
 */
const sendButton = $("send");

sendButton.addEventListener("click", async function () {

  const out = $("out");

  const toInput = $("to").value;
  const from = $("from").value.trim();
  const text = $("text").value.trim();
  const category = $("category").value;


  /*
   * التحقق من الرقم
   */
  const to = normalizeEgyptianNumber(toInput);

  if (!to) {
    out.textContent =
      "رقم الهاتف غير صحيح.\n\nمثال:\n01012345678";
    return;
  }


  /*
   * التحقق من Sender ID
   */
  if (!from) {
    out.textContent =
      "أدخل Sender ID.";
    return;
  }


  /*
   * التحقق من الرسالة
   */
  if (!text) {
    out.textContent =
      "اكتب نص الرسالة.";
    return;
  }


  /*
   * تعطيل الزر أثناء الإرسال
   */
  sendButton.disabled = true;
  sendButton.textContent = "جارٍ الإرسال...";

  out.textContent =
    "جارٍ الاتصال بخادم الإرسال...";


  try {

    const response = await fetch(BACKEND, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        to: to,
        from: from,
        text: text,
        category: category
      })

    });


    /*
     * قراءة رد الخادم
     */
    const responseText = await response.text();

    let result;

    try {
      result = JSON.parse(responseText);
    } catch {
      result = {
        raw: responseText
      };
    }


    /*
     * عرض النتيجة
     */
    out.textContent =
      JSON.stringify(result, null, 2);


  } catch (error) {

    out.textContent =
      "تعذر الاتصال بخادم الإرسال:\n\n" +
      error.message;

  } finally {

    sendButton.disabled = false;
    sendButton.textContent = "إرسال";

  }

});
</script>

</body>
</html>
